<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crimson Sovereign: Hutan. Action-RPG third-person di hutan terbuka: Ilyra bertarung dengan tongkat dan sihir Chaos, lalu membangkitkan musuh yang kalah menjadi pasukan bayangan." />
    <meta name="theme-color" content="#0c0809" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Crimson Sovereign: Hutan (Easy)</title>
  </head>
  <body>
    <main id="app">
      <canvas id="view" aria-label="Hutan Crimson Sovereign"></canvas>

      <div id="hud" class="hud" hidden>
        <div id="overload-veil" class="veil veil-chaos" aria-hidden="true"></div>
        <div id="hurt-veil" class="veil veil-hurt" aria-hidden="true"></div>
        <div id="umbra-veil" class="veil veil-umbra" aria-hidden="true"></div>
        <div id="stone-veil" class="veil veil-stone" aria-hidden="true"></div>
        <div id="fade" class="fade" aria-hidden="true"></div>

        <header class="camp-status">
          <p id="camp-line" class="camp-line"></p>
          <p id="camp-count" class="camp-count num"></p>
          <p id="altar-line" class="altar-line"></p>
        </header>

        <div id="bossbar" class="bossbar" aria-live="polite">
          <p id="boss-name" class="boss-name"></p>
          <div class="boss-hp"><i id="boss-fill"></i></div>
          <p id="boss-hint" class="boss-hint"></p>
        </div>

        <div id="zone-banner" class="zone-banner" aria-live="polite">
          <p id="zone-name" class="zone-name"></p>
          <p id="zone-tier" class="zone-tier"></p>
        </div>
        <div id="banner" class="banner" aria-live="polite">
          <p class="banner-title"></p>
          <p class="banner-sub"></p>
        </div>
        <div id="feed" class="feed" role="log" aria-live="polite"></div>

        <div id="hpbars" class="hpbars" aria-hidden="true"></div>
        <div id="lock-mark" class="lock-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="56" height="56">
            <path d="M20 4 L24 9 M20 4 L16 9 M36 20 L31 24 M36 20 L31 16 M20 36 L24 31 M20 36 L16 31 M4 20 L9 24 M4 20 L9 16" />
            <circle cx="20" cy="20" r="2.2" />
          </svg>
        </div>
        <div id="aim" class="aim" aria-hidden="true">
          <span class="aim-dot"></span>
          <span id="hitmark" class="hitmark"></span>
        </div>
        <div id="parry-flash" class="parry-flash" aria-hidden="true"></div>
        <div class="prompt-box">
          <p id="prompt" class="prompt" aria-live="polite"></p>
          <div id="rite-bar" class="rite-bar" aria-hidden="true"><i id="rite-fill"></i></div>
        </div>

        <section class="vitals" aria-label="Kondisi Ilyra">
          <div class="vital" id="hp-row">
            <span class="vital-label">HP</span>
            <div class="bar bar-hp"><i id="hp-fill"></i></div>
            <span id="hp-text" class="vital-value num"></span>
